<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation History - Linear Solver</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjVGOv-AA-UJgoTzRwqWm8yAsCGpeYf3s",
            authDomain: "linear-solver-db.firebaseapp.com",
            projectId: "linear-solver-db",
            storageBucket: "linear-solver-db.firebasestorage.app",
            messagingSenderId: "986601414726",
            appId: "1:986601414726:web:329ee8bc24c54860d2aa47",
            measurementId: "G-GJ9MK2J758"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.query = query;
        window.orderBy = orderBy;
        window.limit = limit;

        document.addEventListener("DOMContentLoaded", fetchHistoryData);
    </script>
    <style>
        :root {
            --bg-color: #F7F4F0;
            --surface-color: #FFFFFF;
            --primary-color: #C86432;
            --text-main: #3D2516;
            --text-muted: #8B7355;
            --border-color: #E6DFD5;
            --shadow: 0 4px 12px rgba(61, 37, 22, 0.08);
            --radius: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        body {
            font-family: 'Kanit', 'Inter', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 48px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        header {
            display: flex;
            flex-wrap: wrap;              /* ให้ปุ่มตกบรรทัดใหม่เมื่อจอแคบ */
            justify-content: space-between;
            align-items: center;
            gap: 12px 16px;
            background-color: var(--text-main);
            color: #FFFFFF;
            padding: 16px 24px;
            border-radius: var(--radius);
            margin-bottom: 28px;
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: clamp(18px, 4.5vw, 22px);   /* ปรับขนาดตามความกว้างจอ */
            margin: 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            min-width: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* --- ปุ่มสลับภาษา (สไตล์เดียวกับหน้าแรก) --- */
        .lang-switch {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
        }

        .lang-btn {
            padding: 10px 14px;
            min-height: 40px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            background: transparent;
            color: #D3C5B4;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;             /* พื้นที่แตะบนมือถือ */
            white-space: nowrap;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn-back:hover {
            background-color: #B35224;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            min-width: 0;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 24px;
            color: var(--text-main);
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 12px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .history-item {
            background: #FAFCFF;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;              /* ผลลัพธ์ยาว ๆ ตกบรรทัดใหม่ได้ */
            justify-content: space-between;
            align-items: center;
            gap: 12px 16px;
        }

        .history-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 200px;
            min-width: 0;
        }

        .history-method {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        .history-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .history-result {
            font-family: monospace;
            font-size: 14px;
            background: #F3DBB7;
            padding: 6px 12px;
            border-radius: 6px;
            color: var(--text-main);
            font-weight: 500;
            max-width: 100%;
            overflow-wrap: anywhere;      /* คำตอบ N=10 ยาวมาก ต้องตัดบรรทัดได้ */
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 16px;
        }

        .msg-error {
            text-align: center;
            color: red;
            padding: 24px;
        }

        /* =========================================
           📱 Responsive
           ========================================= */

        @media (max-width: 768px) {
            body { padding: 16px; }
            header { padding: 14px 16px; margin-bottom: 20px; }
            .card { padding: 24px; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            header { padding: 12px 14px; }
            .header-actions { width: 100%; flex-wrap: nowrap; }   /* ปุ่มภาษา + ปุ่ม Back อยู่แถวเดียวกัน */
            .btn-back { flex: 1 1 auto; white-space: normal; text-align: center; }
            .card { padding: 16px; }
            h2 { font-size: 16px; margin-bottom: 16px; }
            .history-list { gap: 12px; }
            .history-item {
                flex-direction: column;   /* ข้อมูลบน ผลลัพธ์ล่าง */
                align-items: stretch;
                padding: 14px;
            }
            .history-info { flex: none; }
            .history-method { font-size: 15px; }
            .history-result { font-size: 13px; }
            .loading { padding: 28px 8px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>
            <span style="background: var(--primary-color); color: white; padding: 4px 8px; border-radius: 4px; font-size: 16px;">⏱</span>
            <span data-i18n="title">Calculation History</span>
        </h1>
        <div class="header-actions">
            <div class="lang-switch">
                <button type="button" class="lang-btn active" id="btn-en" aria-pressed="true" onclick="setLanguage('en')">EN</button>
                <button type="button" class="lang-btn" id="btn-th" aria-pressed="false" onclick="setLanguage('th')">TH</button>
            </div>
            <a href="index.html" class="btn-back" data-i18n="back">⬅ Back to Solver</a>
        </div>
    </header>

    <div class="card">
        <h2 data-i18n="heading">Recent Calculations (Firebase Firestore)</h2>
        <div id="historyContainer" class="history-list">
            <div class="loading">Loading history data...</div>
        </div>
    </div>

    <script>
        // ---------- ข้อความ 2 ภาษา ----------
        const I18N = {
            en: {
                pageTitle: "Calculation History - Linear Solver",
                title: "Calculation History",
                back: "⬅ Back to Solver",
                heading: "Recent Calculations (Firebase Firestore)",
                loading: "Loading history data...",
                noConn: "Failed to connect to Firebase.",
                empty: "No calculation history found.",
                error: "Error loading history data. Please check console.",
                result: "Result",
                unknown: "Unknown Method",
                locale: "en-US"
            },
            th: {
                pageTitle: "ประวัติการคำนวณ - Linear Solver",
                title: "ประวัติการคำนวณ",
                back: "⬅ กลับไปหน้าคำนวณ",
                heading: "การคำนวณล่าสุด (Firebase Firestore)",
                loading: "กำลังโหลดข้อมูลประวัติ...",
                noConn: "เชื่อมต่อ Firebase ไม่สำเร็จ",
                empty: "ยังไม่มีประวัติการคำนวณ",
                error: "โหลดข้อมูลประวัติไม่สำเร็จ กรุณาดู console",
                result: "ผลลัพธ์",
                unknown: "ไม่ทราบวิธีการ",
                locale: "th-TH"
            }
        };

        // ชื่อวิธีคำนวณ (ตรงกับรายการในหน้าแรก)
        const METHOD_NAMES = {
            Jacobi:            { en: "Jacobi Iteration",       th: "จาโคบี (Jacobi)" },
            GaussSeidel:       { en: "Gauss-Seidel",           th: "เกาส์-ไซเดล (Gauss-Seidel)" },
            Cramer:            { en: "Cramer's Rule",          th: "กฎของคราเมอร์ (Cramer's Rule)" },
            GaussElimination:  { en: "Gauss Elimination",      th: "การกำจัดของเกาส์ (Gauss Elimination)" },
            LU:                { en: "LU Decomposition",       th: "แยกตัวประกอบ LU (LU Decomposition)" },
            Cholesky:          { en: "Cholesky Decomposition", th: "แยกตัวประกอบโคเลสกี (Cholesky)" },
            ConjugateGradient: { en: "Conjugate Gradient",     th: "คอนจูเกตเกรเดียนต์ (Conjugate Gradient)" }
        };

        // ---------- สถานะของหน้า (render ใหม่ได้ทุกครั้งที่สลับภาษา โดยไม่ต้องโหลด Firebase ซ้ำ) ----------
        let currentLang = 'en';
        let viewState = 'loading';   // 'loading' | 'noConn' | 'empty' | 'error' | 'data'
        let historyRows = [];

        function t(key) { return I18N[currentLang][key]; }

        // สร้าง element พร้อมข้อความ (ใช้ textContent เพื่อไม่ให้ข้อมูลจาก DB ถูกตีความเป็น HTML)
        function makeEl(tag, className, text) {
            const el = document.createElement(tag);
            if (className) el.className = className;
            if (text !== undefined) el.textContent = text;
            return el;
        }

        function methodLabel(method) {
            if (!method) return t('unknown');
            if (Object.prototype.hasOwnProperty.call(METHOD_NAMES, method)) return METHOD_NAMES[method][currentLang];
            return String(method);
        }

        function buildItem(row) {
            const time = row.date ? row.date.toLocaleString(t('locale')) : 'N/A';
            const resultText = row.result
                ? row.result.map(v => Number(v).toFixed(4)).join(", ")
                : "N/A";

            const info = makeEl("div", "history-info");
            info.append(
                makeEl("span", "history-method", `${methodLabel(row.method)} (${row.size}x${row.size})`),
                makeEl("span", "history-time", `🕒 ${time}`)
            );

            const item = makeEl("div", "history-item");
            item.append(info, makeEl("div", "history-result", `${t('result')}: [${resultText}]`));
            return item;
        }

        function render() {
            const container = document.getElementById("historyContainer");
            switch (viewState) {
                case 'loading': container.replaceChildren(makeEl("div", "loading", t('loading'))); break;
                case 'noConn':  container.replaceChildren(makeEl("div", "msg-error", t('noConn'))); break;
                case 'empty':   container.replaceChildren(makeEl("div", "loading", t('empty'))); break;
                case 'error':   container.replaceChildren(makeEl("div", "msg-error", t('error'))); break;
                case 'data':    container.replaceChildren(...historyRows.map(buildItem)); break;
            }
        }

        // ---------- สลับภาษา ----------
        function setLanguage(lang) {
            if (!I18N[lang]) lang = 'en';
            currentLang = lang;
            try { localStorage.setItem('lang', lang); } catch (e) {}   // จำภาษาไว้ใช้ข้ามหน้า

            document.documentElement.lang = lang;
            document.title = t('pageTitle');

            ['en', 'th'].forEach(l => {
                const btn = document.getElementById('btn-' + l);
                btn.classList.toggle('active', l === lang);
                btn.setAttribute('aria-pressed', String(l === lang));
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });

            render();
        }

        // ---------- โหลดประวัติจาก Firestore ----------
        async function fetchHistoryData() {
            try {
                let checkCount = 0;
                while (!window.db && checkCount < 20) {
                    await new Promise(r => setTimeout(r, 200));
                    checkCount++;
                }

                if (!window.db) {
                    viewState = 'noConn';
                    render();
                    return;
                }

                const q = window.query(
                    window.collection(window.db, "history"), 
                    window.orderBy("timestamp", "desc"), 
                    window.limit(10)
                );
                const querySnapshot = await window.getDocs(q);

                if (querySnapshot.empty) {
                    viewState = 'empty';
                    render();
                    return;
                }

                historyRows = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    historyRows.push({
                        method: data.method || '',
                        size: data.matrixSize || 3,
                        result: Array.isArray(data.result) ? data.result : null,
                        date: data.timestamp ? data.timestamp.toDate() : null
                    });
                });
                viewState = 'data';
                render();

            } catch (error) {
                console.error("Error loading history:", error);
                viewState = 'error';
                render();
            }
        }

        // ตั้งภาษาเริ่มต้น (ใช้ภาษาที่เคยเลือกไว้ ถ้ามี)
        (function initLanguage() {
            let saved = 'en';
            try { saved = localStorage.getItem('lang') || 'en'; } catch (e) {}
            setLanguage(saved);
        })();
    </script>
</body>
</html>
